    <script>
      // Aplica o tema salvo ANTES da primeira pintura (evita o "flash" de tema errado).
      // A mesma regra vive em src/lib/theme.ts; aqui sem dependências e sem falhar.
      ;(function () {
        try {
          var pref = 'system'
          try {
            var salvo = window.localStorage.getItem('nap.theme')
            if (salvo === 'light' || salvo === 'dark' || salvo === 'system') pref = salvo
          } catch (e) {}
          var escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = pref === 'system' ? (escuro ? 'dark' : 'light') : pref
        } catch (e) {}
        // Vidro: o padrão é "glass" (decisão de 11/10/2026; mesma regra de src/lib/glass.ts).
        try {
          var vidro = 'glass'
          try {
            var guardado = window.localStorage.getItem('nap.glass')
            if (guardado === 'system' || guardado === 'solid' || guardado === 'glass') vidro = guardado
          } catch (e) {}
          if (vidro !== 'system') document.documentElement.dataset.glass = vidro
        } catch (e) {}
      })()
    </script>
